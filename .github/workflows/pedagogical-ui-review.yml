name: Pedagogical UI Review

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "core/**"
      - "feature/**"
      - "content/**"
      - "audio/**"
      - "tests/manual/**"
      - ".github/workflows/pedagogical-ui-review.yml"
  workflow_dispatch:

jobs:
  emulator-review:
    name: GitHub emulator evidence capture
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 compile SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          PLATFORM_PACKAGE="$($SDKMANAGER --list --channel=3 | awk '/platforms;android-37([.;[:space:]]|$)/ {print $1; exit}')"
          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "Android API 37 platform package was not found."
            exit 1
          fi
          $SDKMANAGER --channel=3 "$PLATFORM_PACKAGE" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run UI review flow and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            gradle --no-daemon :app:connectedDebugAndroidTest               -Pandroid.testInstrumentationRunnerArguments.class=com.uysal.minikakademi.app.PedagogicalUiReviewTest
            mkdir -p ui-review-evidence
            adb pull /sdcard/Android/data/com.uysal.minikakademi/files/ui-review/. ui-review-evidence/

      - name: Verify screenshot evidence
        run: |
          set -euo pipefail
          COUNT="$(find ui-review-evidence -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
          echo "Captured screenshots: $COUNT"
          if [ "$COUNT" -lt 17 ]; then
            echo "Expected at least 17 UI review screenshots."
            find ui-review-evidence -maxdepth 1 -type f -print || true
            exit 1
          fi

      - name: Upload pedagogical UI evidence
        uses: actions/upload-artifact@v4
        with:
          name: minik-akademi-step13-ui-review-evidence
          path: ui-review-evidence/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minik-akademi-step13-instrumentation-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 30
