name: Content Validation

on:
  push:
    paths:
      - "content/**"
      - "content_v4/**"
      - "tools/content-validator/**"
      - "tools/content-validator/prepare_v4_runtime_content.py"
      - ".github/workflows/content-validation.yml"
  pull_request:
    paths:
      - "content/**"
      - "tools/content-validator/**"
      - ".github/workflows/content-validation.yml"

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r tools/content-validator/requirements.txt

      - name: Validate authored content
        run: python tools/content-validator/validate_content.py --mode authoring
