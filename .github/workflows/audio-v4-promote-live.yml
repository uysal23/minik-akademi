name: Promote Audio V4 C Live

# Historical/maintenance workflow. Manual dispatch only after Audio V4 C activation.
on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and assemble validated C voice
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io
          import os
          import shutil
          import urllib.request
          import zipfile
          from pathlib import Path

          artifact_ids = [
              10934530775, 10934520470, 10934137791, 10933494299,
              10933768803, 10933544334, 10933959440, 10934261948,
              10934615218, 10933089807, 10933883786, 10934436488,
              10934112768, 10934117425, 10934102830, 10933569101,
          ]

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GH_REPO"]
          assembled = Path("/tmp/v4all")
          if assembled.exists():
              shutil.rmtree(assembled)
          assembled.mkdir(parents=True)

          seen = set()
          for artifact_id in artifact_ids:
              url = f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "minik-akademi-audio-promoter",
                  },
              )
              with urllib.request.urlopen(req, timeout=90) as resp:
                  data = resp.read()
              with zipfile.ZipFile(io.BytesIO(data)) as zf:
                  for member in zf.infolist():
                      if member.is_dir() or not member.filename.lower().endswith(".ogg"):
                          continue
                      name = Path(member.filename).name
                      if name in seen:
                          raise SystemExit(f"Duplicate audio filename: {name}")
                      seen.add(name)
                      (assembled / name).write_bytes(zf.read(member))

          files = sorted(assembled.glob("*.ogg"))
          if len(files) != 159:
              raise SystemExit(f"Expected 159 generated files, got {len(files)}")
          print("Downloaded C voice:", len(files))
          PY

      - name: Apply user-approved phonemes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          import zipfile
          zip_path = Path("audio/v4/approved_phonemes/minik-akademi-v4-c-phoneme-qa.zip")
          extract = Path("/tmp/v4approved")
          extract.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(zip_path) as zf:
              zf.extractall(extract)

          dst = Path("/tmp/v4all")
          expected = {"a","n","e","t","i","l","o","k","u"}
          files = list(extract.rglob("aud_phoneme_*.ogg"))
          present = {p.stem.removeprefix("aud_phoneme_") for p in files}
          if present != expected:
              raise SystemExit(f"Approved phoneme set mismatch: {sorted(present)}")

          by_name = {p.name:p for p in files}
          for ph in sorted(expected):
              data = by_name[f"aud_phoneme_{ph}.ogg"].read_bytes()
              (dst / f"aud_phoneme_{ph}.ogg").write_bytes(data)
          print("Applied exact 9/9 user-approved phoneme files from approved QA ZIP")
          PY

      - name: Verify 159 files and OGG format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import struct
          from pathlib import Path

          generated = Path("/tmp/v4all")
          files = sorted(generated.glob("*.ogg"))
          if len(files) != 159:
              raise SystemExit(f"Expected 159 files, got {len(files)}")

          errors = []
          for p in files:
              data = p.read_bytes()
              if not data.startswith(b"OggS"):
                  errors.append(f"{p.name}: missing OggS header")
                  continue
              idx = data.find(b"\x01vorbis")
              if idx < 0:
                  errors.append(f"{p.name}: missing Vorbis identification header")
                  continue
              pos = idx + 7
              if len(data) < pos + 9:
                  errors.append(f"{p.name}: truncated Vorbis header")
                  continue
              version = struct.unpack_from("<I", data, pos)[0]
              channels = data[pos + 4]
              sample_rate = struct.unpack_from("<I", data, pos + 5)[0]
              if version != 0:
                  errors.append(f"{p.name}: Vorbis version {version}")
              if channels != 1:
                  errors.append(f"{p.name}: channels={channels}")
              if sample_rate != 24000:
                  errors.append(f"{p.name}: sample_rate={sample_rate}")

          if errors:
              raise SystemExit("\n".join(errors))
          print("Audio format QA PASS: 159/159 OGG Vorbis, mono, 24 kHz")
          PY

      - name: Replace live speech assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import shutil
          from pathlib import Path

          src = Path("/tmp/v4all")
          dst = Path("audio/generated/speech")
          dst.mkdir(parents=True, exist_ok=True)

          for p in dst.glob("*.ogg"):
              p.unlink()
          for p in src.glob("*.ogg"):
              shutil.copy2(p, dst / p.name)

          files = list(dst.glob("*.ogg"))
          if len(files) != 159:
              raise SystemExit(f"Live speech count mismatch: {len(files)}")
          print("Live speech replaced:", len(files))
          PY

      - name: Build and validate final V4 manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audio/build_audio_manifest_v4.py
          python3 tools/audio/validate_spoken_text_v4.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          src = json.loads(Path("audio/v4/full_manifest.json").read_text(encoding="utf-8"))
          items = src["items"]
          if len(items) != 159:
              raise SystemExit(f"Manifest item count mismatch: {len(items)}")

          live_names = {p.name for p in Path("audio/generated/speech").glob("*.ogg")}
          expected_names = {f"{item['audioId']}.ogg" for item in items}
          if live_names != expected_names:
              missing = sorted(expected_names - live_names)
              extra = sorted(live_names - expected_names)
              raise SystemExit(f"Live/manifest mismatch. missing={missing} extra={extra}")

          profiles = {}
          final_items = []
          for item in items:
              profiles.setdefault(item["voiceProfile"], {"speed": item["speed"], "pitch": 0})
              final_items.append({
                  "audioId": item["audioId"],
                  "text": item["text"],
                  "spokenText": item["spokenText"],
                  "voiceProfile": item["voiceProfile"],
                  "source": item.get("source"),
                  "speed": item["speed"],
                  "output": f"audio/generated/speech/{item['audioId']}.ogg",
              })

          manifest = {
              "schemaVersion": "1.0",
              "audioRevision": "V4_C",
              "provider": "self-hosted open source",
              "model": "ResembleAI Chatterbox Multilingual V3",
              "voice": "C",
              "voiceSeed": 618034,
              "license": "MIT",
              "paidApiUsed": False,
              "apiKeyRequired": False,
              "runtimeMode": "OFFLINE_PACKAGED_AUDIO",
              "syntheticDisclosureRequired": True,
              "profiles": profiles,
              "items": final_items,
          }
          Path("audio/manifest/audio_manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          report = {
              "provider": "self-hosted open source",
              "model": "ResembleAI Chatterbox Multilingual V3",
              "voice": "C",
              "voiceSeed": 618034,
              "audioRevision": "V4_C",
              "paidApiUsed": False,
              "apiKeyRequired": False,
              "requested": 159,
              "generated": 159,
              "skipped": 0,
              "failed": 0,
              "phonemeQa": {
                  "status": "USER_APPROVED",
                  "phonemes": ["a","n","e","t","i","l","o","k","u"],
              },
              "results": [
                  {
                      "audioId": item["audioId"],
                      "status": "generated",
                      "output": item["output"],
                      "profile": item["voiceProfile"],
                      "seed": 618034,
                  }
                  for item in final_items
              ],
              "failures": [],
          }
          Path("audio/manifest/generation_report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("Final manifest QA PASS: 159/159")
          PY

      - name: Mark V4 C live
        shell: bash
        run: |
          cat > docs/AUDIO_V4_STATUS.md <<'EOF'
          # Minik Akademi — Audio V4 C Status

          **Status:** LIVE / USER APPROVED
          **Voice:** C
          **Engine:** ResembleAI Chatterbox Multilingual V3
          **Seed:** 618034
          **Paid API:** none
          **API key:** none

          ## Final result

          - Spoken-text inventory: 159/159
          - Spoken Text QA: PASS
          - C-voice generation: 159/159
          - Live speech assets: 159/159
          - Format: OGG/Vorbis, mono, 24 kHz
          - Phonemes a/n/e/t/i/l/o/k/u: USER APPROVED
          - Existing V1 speech assets replaced by the approved V4 C set.
          - Existing SFX and non-audio locked product behavior remain unchanged.

          The production speech assets are now the V4 C voice set.
          EOF

      - name: Commit V4 C live audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/generated/speech audio/manifest/audio_manifest.json audio/manifest/generation_report.json docs/AUDIO_V4_STATUS.md
          git diff --cached --quiet && {
            echo "No changes to commit"
            exit 0
          }
          git commit -m "audio: promote approved V4 C voice to live app"
          git push origin HEAD:main

# trigger: promote approved V4 C live
