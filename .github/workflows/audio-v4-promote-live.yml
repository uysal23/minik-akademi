name: Promote Audio V4 C Live

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/audio-v4-promote-live.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip
          python -m pip install -r tools/content-validator/requirements.txt

      - name: Download all validated C-voice chunks
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/v4chunks /tmp/v4all
          mkdir -p /tmp/v4chunks /tmp/v4all
          ids=(
            10934530775
            10934520470
            10934137791
            10933494299
            10933768803
            10933544334
            10933959440
            10934261948
            10934615218
            10933089807
            10933883786
            10934436488
            10934112768
            10934117425
            10934102830
            10933569101
          )
          for id in "${ids[@]}"; do
            curl --fail --location --retry 3               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id/zip"               -o "/tmp/v4chunks/$id.zip"
            mkdir -p "/tmp/v4chunks/$id"
            unzip -q "/tmp/v4chunks/$id.zip" -d "/tmp/v4chunks/$id"
          done

          find /tmp/v4chunks -type f -name '*.ogg' -exec cp {} /tmp/v4all/ \;
          count="$(find /tmp/v4all -maxdepth 1 -type f -name '*.ogg' | wc -l)"
          echo "Collected C-voice OGG count: $count"
          test "$count" -eq 159

      - name: Replace nine phonemes with user-approved short C variants
        shell: bash
        run: |
          set -euo pipefail
          # Exact acoustic regions verified against the user-approved QA clips.
          # Output is peak-safe, 24 kHz mono Vorbis.
          cut_phone() {
            local ph="$1"
            local start="$2"
            local dur="$3"
            local src="/tmp/v4all/aud_phoneme_${ph}.ogg"
            local dst="/tmp/v4all/aud_phoneme_${ph}.approved.ogg"
            ffmpeg -y -loglevel error               -ss "$start" -t "$dur" -i "$src"               -ac 1 -ar 24000               -af "loudnorm=I=-20:LRA=7:TP=-3"               -c:a libvorbis -q:a 5 "$dst"
            mv "$dst" "$src"
          }

          cut_phone a 0.1339583333 0.280
          cut_phone e 0.1239583333 0.280
          cut_phone i 0.1314583333 0.280
          cut_phone o 0.1289583333 0.280
          cut_phone u 0.1164583333 0.280
          cut_phone n 0.0985000000 0.110
          cut_phone l 0.1060000000 0.110
          cut_phone t 0.1010000000 0.065
          cut_phone k 0.3735000000 0.065

      - name: Promote all 159 speech files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audio/generated/speech
          rm -f audio/generated/speech/*.ogg
          cp /tmp/v4all/*.ogg audio/generated/speech/
          test "$(find audio/generated/speech -maxdepth 1 -type f -name '*.ogg' | wc -l)" -eq 159

      - name: Build final V4 C manifest and report
        shell: bash
        run: |
          set -euo pipefail
          python tools/audio/build_audio_manifest_v4.py
          python tools/audio/validate_spoken_text_v4.py
          python - <<'PY'
          import json
          from pathlib import Path

          src = json.loads(Path("audio/v4/full_manifest.json").read_text(encoding="utf-8"))
          profile_speeds = {}
          items = []
          for item in src["items"]:
              profile_speeds.setdefault(item["voiceProfile"], {"speed": item["speed"], "pitch": 0})
              items.append({
                  "audioId": item["audioId"],
                  "text": item["text"],
                  "spokenText": item["spokenText"],
                  "voiceProfile": item["voiceProfile"],
                  "source": item.get("source"),
                  "speed": item["speed"],
                  "output": f"audio/generated/speech/{item['audioId']}.ogg",
              })

          manifest = {
              "schemaVersion": "1.0",
              "audioRevision": "V4_C",
              "provider": "self-hosted open source",
              "model": "ResembleAI Chatterbox Multilingual V3",
              "voice": "C",
              "voiceSeed": 618034,
              "license": "MIT",
              "paidApiUsed": False,
              "apiKeyRequired": False,
              "runtimeMode": "OFFLINE_PACKAGED_AUDIO",
              "syntheticDisclosureRequired": True,
              "profiles": profile_speeds,
              "items": items,
          }
          Path("audio/manifest/audio_manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          report = {
              "provider": "self-hosted open source",
              "model": "ResembleAI Chatterbox Multilingual V3",
              "voice": "C",
              "voiceSeed": 618034,
              "audioRevision": "V4_C",
              "paidApiUsed": False,
              "apiKeyRequired": False,
              "requested": len(items),
              "generated": len(items),
              "skipped": 0,
              "failed": 0,
              "phonemeQa": {
                  "status": "USER_APPROVED",
                  "phonemes": ["a","n","e","t","i","l","o","k","u"],
              },
              "results": [
                  {
                      "audioId": item["audioId"],
                      "status": "generated",
                      "output": item["output"],
                      "profile": item["voiceProfile"],
                      "seed": 618034,
                  }
                  for item in items
              ],
              "failures": [],
          }
          Path("audio/manifest/generation_report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify every live speech asset
        shell: bash
        run: |
          set -euo pipefail
          test "$(find audio/generated/speech -maxdepth 1 -type f -name '*.ogg' | wc -l)" -eq 159

          for f in audio/generated/speech/*.ogg; do
            codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$f")"
            rate="$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=nw=1:nk=1 "$f")"
            channels="$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of default=nw=1:nk=1 "$f")"
            test "$codec" = "vorbis"
            test "$rate" = "24000"
            test "$channels" = "1"
          done

          python tools/audio/validate_audio_assets.py
          python tools/content-validator/validate_content.py --mode authoring

      - name: Record V4 C as live
        shell: bash
        run: |
          cat > audio/AUDIO_V4.trigger <<'EOF'
          version=4
          engine=Chatterbox-Multilingual-V3
          voice=C
          seed=618034
          paid_api=false
          api_key_required=false
          qa_revision=4
          phoneme_qa=USER_APPROVED
          mode=LIVE_V4_C
          EOF

          cat > docs/AUDIO_V4_STATUS.md <<'EOF'
          # Minik Akademi — Audio V4 C Status

          **Status:** LIVE / USER APPROVED
          **Voice:** C
          **Engine:** ResembleAI Chatterbox Multilingual V3
          **Seed:** 618034
          **Paid API:** none
          **API key:** none

          ## Final result

          - Application spoken-text inventory: 159/159
          - Spoken Text QA: PASS
          - Content Validation: PASS
          - Live speech OGG files: 159/159
          - Format: OGG/Vorbis, mono, 24 kHz
          - Nine phonemes a/n/e/t/i/l/o/k/u: USER APPROVED
          - All former V1 speech files replaced by the approved V4 C set.
          - Existing SFX and all non-audio locked product behavior remain unchanged.

          The production speech assets are now the V4 C voice set.
          EOF

      - name: Commit promoted audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/generated/speech                   audio/manifest/audio_manifest.json                   audio/manifest/generation_report.json                   audio/AUDIO_V4.trigger                   docs/AUDIO_V4_STATUS.md
          git diff --cached --stat
          git commit -m "audio: promote approved V4 C voice to live app"
          git push origin HEAD:main
