name: Audio V2 Quality Samples

on:
  push:
    branches: [ "main" ]
    paths:
      - "audio/AUDIO_V2.trigger"
      - ".github/workflows/audio-v2-samples.yml"
      - "tools/audio/generate_freya_teacher_audio.py"
      - "audio/v2/sample_manifest.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-v2-samples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run_samples: ${{ steps.gate.outputs.run_samples }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        shell: bash
        run: |
          if grep -Fq 'mode=GENERATE_SAMPLES' audio/AUDIO_V2.trigger; then
            echo "run_samples=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_samples=false" >> "$GITHUB_OUTPUT"
            echo "Audio V2 sample generation is paused."
          fi

  samples:
    needs: gate
    if: needs.gate.outputs.run_samples == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install free self-hosted FreyaTTS-small
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg git
          git clone --depth 1 https://github.com/freyavoiceai/FreyaTTS.git /tmp/FreyaTTS
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/FreyaTTS/requirements.txt

      - name: Generate Audio V2 sample pack
        shell: bash
        run: |
          set -euo pipefail
          python tools/audio/generate_freya_teacher_audio.py             --manifest audio/v2/sample_manifest.json             --freya-root /tmp/FreyaTTS             --output-dir audio/v2/generated_samples             --report audio/v2/sample_report.json             --steps 32             --force
          test "$(find audio/v2/generated_samples -type f -name '*.ogg' | wc -l)" -eq 10

      - name: Verify no paid API secret is required
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "MINIMAX_API_KEY\|ELEVENLABS\|OPENAI_API_KEY"             audio/AUDIO_V2.trigger audio/v2/sample_manifest.json tools/audio/generate_freya_teacher_audio.py

      - name: Upload Audio V2 samples
        uses: actions/upload-artifact@v4
        with:
          name: minik-akademi-audio-v2-quality-samples-free
          path: |
            audio/v2/generated_samples/*.ogg
            audio/v2/sample_report.json
            audio/v2/sample_manifest.json
          if-no-files-found: error
          retention-days: 30
