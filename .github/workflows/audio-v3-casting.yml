name: Audio V3 Gentle Voice Casting

on:
  push:
    branches: [ "main" ]
    paths:
      - "tools/audio/generate_gentle_voice_casting.py"
      - ".github/workflows/audio-v3-casting.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-v3-casting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  casting:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android             /opt/ghc             /usr/share/dotnet             /opt/hostedtoolcache/CodeQL             /usr/local/share/boost
          sudo apt-get clean
          rm -rf ~/.cache/pip
          df -h

      - name: Install CPU-only PyTorch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install             --index-url https://download.pytorch.org/whl/cpu             torch torchaudio

      - name: Install FreyaTTS-small
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg git
          git clone --depth 1 https://github.com/freyavoiceai/FreyaTTS.git /tmp/FreyaTTS
          python -m pip install -r /tmp/FreyaTTS/requirements.txt
          rm -rf ~/.cache/pip

      - name: Generate gentle teacher casting
        shell: bash
        run: |
          set -euo pipefail
          python tools/audio/generate_gentle_voice_casting.py             --freya-root /tmp/FreyaTTS             --output-dir audio/v3/casting             --report audio/v3/casting_report.json             --steps 32
          test "$(find audio/v3/casting -type f -name '*.ogg' | wc -l)" -eq 24

      - name: Upload casting pack
        uses: actions/upload-artifact@v4
        with:
          name: minik-akademi-audio-v3-gentle-voice-casting
          path: |
            audio/v3/casting/*.ogg
            audio/v3/casting_report.json
          if-no-files-found: error
          retention-days: 30
