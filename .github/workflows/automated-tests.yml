name: Automated Tests

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "core/**"
      - "feature/**"
      - "content/**"
      - "content_v4/**"
      - "audio/**"
      - "audio_v4/**"
      - "tools/**"
      - "tests/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/automated-tests.yml"
  pull_request:
    paths:
      - "app/**"
      - "core/**"
      - "feature/**"
      - "content/**"
      - "content_v4/**"
      - "audio/**"
      - "audio_v4/**"
      - "tools/**"
      - "tests/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/automated-tests.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  project-contract-tests:
    name: Project contracts and validators
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r tools/content-validator/requirements.txt

      - name: Run Python automated tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate authored content
        run: python tools/content-validator/validate_content.py --mode authoring

      - name: Validate offline audio
        run: python tools/audio/validate_audio_assets.py

      - name: Validate offline visuals
        run: python tools/asset-validator/validate_visual_assets.py

  android-unit-tests:
    name: Kotlin unit tests and debug build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 compile SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          PLATFORM_PACKAGE="$($SDKMANAGER --list --channel=3 | awk '/platforms;android-37([.;[:space:]]|$)/ {print $1; exit}')"
          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "Android API 37 platform package was not found."
            exit 1
          fi
          $SDKMANAGER --channel=3 "$PLATFORM_PACKAGE" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Gradle configuration check
        run: gradle --no-daemon help

      - name: Run Kotlin unit tests
        run: |
          gradle --no-daemon             :core:model:testDebugUnitTest             :core:navigation:testDebugUnitTest

      - name: Build debug APK after tests
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-test-reports
          path: |
            core/model/build/test-results/testDebugUnitTest/
            core/navigation/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload tested debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: minik-akademi-step12-tested-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
