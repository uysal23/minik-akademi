name: Production v1 Release Candidate

on:
  push:
    branches: [ "main" ]
    paths:
      - "release/production-v1.trigger"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: minik-akademi-production-v1
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  trigger-gate:
    name: Check production release trigger
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read trigger state
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'status=RUN_PRODUCTION_V1' release/production-v1.trigger; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Production v1 trigger is armed."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Production v1 is waiting for GitHub signing secrets."
          fi

  build-production:
    name: Build and verify production-signed v1.0.0
    needs: trigger-gate
    if: needs.trigger-gate.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      APK_NAME: MinikAkademi-v1.0.0.apk
      AAB_NAME: MinikAkademi-v1.0.0.aab
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Step 15 locked baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -F '**Status:** LOCKED' docs/RELEASE_BUILD_V1.md
          grep -F '| RELEASE_BUILD_V1.md — Release APK Build / Technical Acceptance | 1.0 | LOCKED | 15 |' docs/LOCK_INDEX.md
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("tests/regression/locked_baseline_v1.json").read_text(encoding="utf-8"))
          assert data["lockedThroughStep"] == 15, data
          print("Step 15 locked baseline verified.")
          PY

      - name: Require production signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MINIK_AKADEMI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MINIK_AKADEMI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MINIK_AKADEMI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MINIK_AKADEMI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "Production signing secrets are present."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r tools/content-validator/requirements.txt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install compile SDK and signing tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          PLATFORM_PACKAGE="$($SDKMANAGER --list --channel=3 | awk '/platforms;android-37([.;[:space:]]|$)/ {print $1; exit}')"
          test -n "$PLATFORM_PACKAGE"
          $SDKMANAGER --channel=3 "$PLATFORM_PACKAGE" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare approved V4 C audio\n        run: python tools/audio/prepare_v4_runtime_audio.py\n\n      - name: Run final locked test suite and validators
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python tools/content-validator/validate_content.py --mode authoring
          python tools/audio/validate_audio_assets.py
          python tools/asset-validator/validate_visual_assets.py

      - name: Build unsigned APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Restore production keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MINIK_AKADEMI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MINIK_AKADEMI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MINIK_AKADEMI_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/minik-akademi-production.jks"
          keytool -list -keystore "$RUNNER_TEMP/minik-akademi-production.jks"             -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Production keystore restored and alias verified."

      - name: Sign production APK and AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MINIK_AKADEMI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MINIK_AKADEMI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MINIK_AKADEMI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p production-release
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APK_UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          AAB_UNSIGNED="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK_UNSIGNED"
          test -s "$AAB_UNSIGNED"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK_UNSIGNED" production-release/aligned.apk

          # keytool defaults to PKCS12 on modern JDKs. For PKCS12, the private-key
          # password may be the same as the store password even if a distinct
          # -keypass was originally supplied. Try the explicit key secret first,
          # then safely retry with the already-verified store secret.
          if ! "$BUILD_TOOLS/apksigner" sign             --ks "$RUNNER_TEMP/minik-akademi-production.jks"             --ks-key-alias "$KEY_ALIAS"             --ks-pass env:KEYSTORE_PASSWORD             --key-pass env:KEY_PASSWORD             --out "production-release/$APK_NAME"             production-release/aligned.apk
          then
            echo "Explicit key password was not accepted; retrying PKCS12-compatible store password."
            "$BUILD_TOOLS/apksigner" sign             --ks "$RUNNER_TEMP/minik-akademi-production.jks"             --ks-key-alias "$KEY_ALIAS"             --ks-pass env:KEYSTORE_PASSWORD             --key-pass env:KEYSTORE_PASSWORD             --out "production-release/$APK_NAME"             production-release/aligned.apk
          fi
          rm production-release/aligned.apk

          cp "$AAB_UNSIGNED" "production-release/$AAB_NAME"
          if ! jarsigner             -keystore "$RUNNER_TEMP/minik-akademi-production.jks"             -storepass "$KEYSTORE_PASSWORD"             -keypass "$KEY_PASSWORD"             "production-release/$AAB_NAME" "$KEY_ALIAS"
          then
            echo "Explicit AAB key password was not accepted; retrying PKCS12-compatible store password."
            jarsigner             -keystore "$RUNNER_TEMP/minik-akademi-production.jks"             -storepass "$KEYSTORE_PASSWORD"             -keypass "$KEYSTORE_PASSWORD"             "production-release/$AAB_NAME" "$KEY_ALIAS"
          fi

      - name: Verify production signatures and package
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MINIK_AKADEMI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MINIK_AKADEMI_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APK="production-release/$APK_NAME"
          AAB="production-release/$AAB_NAME"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"             | tee production-release/APK_SIGNATURE.txt
          jarsigner -verify -verbose -certs "$AAB"             > production-release/AAB_SIGNATURE.txt

          "$BUILD_TOOLS/aapt" dump badging "$APK"             | tee production-release/APK_BADGING.txt
          "$BUILD_TOOLS/aapt" dump permissions "$APK"             | tee production-release/APK_PERMISSIONS.txt

          grep -F "package: name='com.uysal.minikakademi'" production-release/APK_BADGING.txt
          grep -F "versionCode='1'" production-release/APK_BADGING.txt
          grep -F "versionName='1.0.0'" production-release/APK_BADGING.txt
          grep -F "sdkVersion:'26'" production-release/APK_BADGING.txt
          grep -F "targetSdkVersion:'37'" production-release/APK_BADGING.txt

          if grep -Fq "android.permission.INTERNET" production-release/APK_PERMISSIONS.txt; then
            echo "Production APK unexpectedly requests INTERNET permission."
            exit 1
          fi

          keytool -list -v             -keystore "$RUNNER_TEMP/minik-akademi-production.jks"             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS"             > production-release/PRODUCTION_CERTIFICATE.txt

          sha256sum "$APK" "$AAB" | tee production-release/SHA256SUMS.txt

      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minik-akademi-v1-production
          path: production-release/
          if-no-files-found: error
          retention-days: 90

      - name: Verify production APK payload matches release build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path

          unsigned = Path("app/build/outputs/apk/release/app-release-unsigned.apk")
          signed = Path("production-release/MinikAkademi-v1.0.0.apk")

          def payload(path: Path):
              with zipfile.ZipFile(path) as zf:
                  out = {}
                  for name in zf.namelist():
                      if name.endswith("/") or name.upper().startswith("META-INF/"):
                          continue
                      out[name] = hashlib.sha256(zf.read(name)).hexdigest()
                  return out

          left = payload(unsigned)
          right = payload(signed)
          if left != right:
              missing = sorted(set(left) - set(right))
              added = sorted(set(right) - set(left))
              changed = sorted(k for k in set(left) & set(right) if left[k] != right[k])
              raise SystemExit(
                  f"Production signing changed APK payload. missing={missing[:10]} "
                  f"added={added[:10]} changed={changed[:10]}"
              )

          Path("production-release/PAYLOAD_EQUIVALENCE.txt").write_text(
              f"PASS\nCompared payload entries: {len(left)}\n"
              "Unsigned release payload and production-signed APK payload are identical.\n",
              encoding="utf-8",
          )
          print(f"Production APK payload equivalence PASS: {len(left)} entries")
          PY

      - name: Run production offline install and runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu
            mkdir -p production-smoke
            adb shell settings put global hide_error_dialogs 1 || true
            adb logcat -c || true
            adb install --no-incremental -r "production-release/$APK_NAME"
            adb shell svc wifi disable || true
            adb shell svc data disable || true

            adb shell am start -W -n com.uysal.minikakademi/com.uysal.minikakademi.app.MainActivity               | tee production-smoke/first-launch.txt
            sleep 4
            adb shell pidof com.uysal.minikakademi | tee production-smoke/first-pid.txt
            test -s production-smoke/first-pid.txt
            adb shell dumpsys activity activities > production-smoke/activities-first.txt
            grep -F "com.uysal.minikakademi/.app.MainActivity" production-smoke/activities-first.txt
            adb exec-out screencap -p > production-smoke/01-production-first-launch.png
            test -s production-smoke/01-production-first-launch.png

            adb shell am force-stop com.uysal.minikakademi
            adb shell am start -W -n com.uysal.minikakademi/com.uysal.minikakademi.app.MainActivity               | tee production-smoke/relaunch.txt
            sleep 3
            adb shell pidof com.uysal.minikakademi | tee production-smoke/relaunch-pid.txt
            test -s production-smoke/relaunch-pid.txt
            adb shell dumpsys activity activities > production-smoke/activities-relaunch.txt
            grep -F "com.uysal.minikakademi/.app.MainActivity" production-smoke/activities-relaunch.txt
            adb exec-out screencap -p > production-smoke/02-production-relaunch.png
            test -s production-smoke/02-production-relaunch.png

            adb logcat -d > production-smoke/release-logcat.txt
            python -c 'from pathlib import Path; t=Path("production-smoke/release-logcat.txt").read_text(encoding="utf-8", errors="replace"); assert "ANR in com.uysal.minikakademi" not in t, "Production release smoke detected ANR"; assert not ("FATAL EXCEPTION" in t and "Process: com.uysal.minikakademi" in t), "Production release smoke detected fatal exception"'
            echo "Production offline install/relaunch/crash smoke PASS" | tee production-smoke/RESULT.txt

      - name: Upload production acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: minik-akademi-v1-production-acceptance
          path: |
            production-smoke/
            production-release/PAYLOAD_EQUIVALENCE.txt
          if-no-files-found: error
          retention-days: 90

      - name: Create or update draft GitHub Release v1.0.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0               "production-release/$APK_NAME"               "production-release/$AAB_NAME"               production-release/SHA256SUMS.txt               production-release/PRODUCTION_CERTIFICATE.txt               --clobber
            gh release edit v1.0.0               --draft               --title "Minik Akademi v1.0.0"               --notes-file docs/PRODUCTION_RELEASE_V1.md
          else
            gh release create v1.0.0               "production-release/$APK_NAME"               "production-release/$AAB_NAME"               production-release/SHA256SUMS.txt               production-release/PRODUCTION_CERTIFICATE.txt               --target "$GITHUB_SHA"               --draft               --title "Minik Akademi v1.0.0"               --notes-file docs/PRODUCTION_RELEASE_V1.md
          fi
          echo "Draft GitHub Release v1.0.0 prepared."
