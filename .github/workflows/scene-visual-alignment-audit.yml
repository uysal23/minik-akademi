name: Scene Visual Alignment Audit

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/scene-visual-alignment-audit.yml"
      - "feature/mathematics/**"
      - "core/design-system/**"
      - "content/**"
      - "tools/asset-validator/validate_scene_visual_alignment.py"
      - "docs/SCENE_VISUAL_ALIGNMENT_V2.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate scene-to-visual semantics
        run: python tools/asset-validator/validate_scene_visual_alignment.py

      - name: Export every authored scene
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from pathlib import Path

          root=Path.cwd()
          content=root/"content"
          rows=[]
          skip={"activity_schema.json","curriculum_manifest.json"}
          for p in sorted(content.rglob("*.json")):
              if p.name in skip:
                  continue
              d=json.loads(p.read_text(encoding="utf-8"))
              inter=d.get("interaction") or {}
              target=d.get("learningTarget") or {}
              assets=d.get("assets") or {}
              opts=[]
              for o in inter.get("options") or []:
                  opts.append({
                      "id":o.get("id"),
                      "label":o.get("label"),
                      "value":o.get("value"),
                      "correct":o.get("correct")
                  })
              rows.append({
                  "path":p.relative_to(root).as_posix(),
                  "id":d.get("id"),
                  "curriculumId":d.get("curriculumId"),
                  "title":d.get("title"),
                  "domain":d.get("domain"),
                  "sourceType":d.get("sourceType"),
                  "activityType":d.get("activityType"),
                  "instruction":(d.get("instruction") or {}).get("text"),
                  "instructionAudioId":(d.get("instruction") or {}).get("audioId"),
                  "targetSymbol":target.get("targetSymbol"),
                  "conceptId":target.get("conceptId"),
                  "options":opts,
                  "visualIds":assets.get("visualIds") or [],
                  "avatarUse":assets.get("avatarUse") or {},
                  "interactionMode":inter.get("mode"),
              })
          if len(rows)!=125:
              raise SystemExit(f"Expected 125 scenes, found {len(rows)}")
          out=root/"scene-audit"
          out.mkdir(exist_ok=True)
          (out/"all-scenes.json").write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding="utf-8")
          fields=["path","id","curriculumId","title","domain","sourceType","activityType","instruction","targetSymbol","interactionMode","visualIds"]
          with (out/"all-scenes.csv").open("w",newline="",encoding="utf-8-sig") as f:
              w=csv.DictWriter(f,fieldnames=fields)
              w.writeheader()
              for r in rows:
                  x={k:r.get(k) for k in fields}
                  x["visualIds"]=";".join(r["visualIds"])
                  w.writerow(x)
          from collections import Counter
          summary={
              "count":len(rows),
              "byTopFolder":dict(Counter(r["path"].split("/")[1] if "/" in r["path"] else r["path"] for r in rows)),
              "byActivityType":dict(Counter(r["activityType"] for r in rows)),
              "emptyVisualIds":sum(not r["visualIds"] for r in rows),
          }
          (out/"summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Upload audit dataset
        uses: actions/upload-artifact@v4
        with:
          name: minik-akademi-all-scenes-audit
          path: scene-audit/
          retention-days: 7
