name: Step 15 Release Candidate

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/release-apk.yml"
      - "tools/release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    name: Build, sign and fully test release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Step 14 lock
        shell: bash
        run: |
          set -euo pipefail
          grep -F '**Status:** LOCKED' docs/REGRESSION_TESTS_V1.md
          grep -F '| REGRESSION_TESTS_V1.md — Regresyon Testleri | 1.0 | LOCKED | 14 |' docs/LOCK_INDEX.md
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("tests/regression/locked_baseline_v1.json").read_text(encoding="utf-8"))
          assert data["lockedThroughStep"] == 14
          print("Step 14 gate verified.")
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r tools/content-validator/requirements.txt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 compile SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          PLATFORM_PACKAGE="$($SDKMANAGER --list --channel=3 | awk '/platforms;android-37([.;[:space:]]|$)/ {print $1; exit}')"
          test -n "$PLATFORM_PACKAGE"
          $SDKMANAGER --channel=3 "$PLATFORM_PACKAGE" "build-tools;36.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run release preflight contracts
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python tools/content-validator/validate_content.py --mode authoring
          python tools/audio/validate_audio_assets.py
          python tools/asset-validator/validate_visual_assets.py

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Create temporary CI signing key and sign APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p step15-release

          keytool -genkeypair -noprompt             -keystore "$RUNNER_TEMP/step15-ci.jks"             -storepass android             -keypass android             -alias step15ci             -keyalg RSA             -keysize 4096             -validity 365             -dname "CN=Minik Akademi Step15 CI,O=uysal23,C=TR"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"

          "$BUILD_TOOLS/zipalign" -p -f 4             "$UNSIGNED"             step15-release/MinikAkademi-0.1.0-release-aligned.apk

          "$BUILD_TOOLS/apksigner" sign             --ks "$RUNNER_TEMP/step15-ci.jks"             --ks-key-alias step15ci             --ks-pass pass:android             --key-pass pass:android             --out step15-release/MinikAkademi-0.1.0-release-ci-signed.apk             step15-release/MinikAkademi-0.1.0-release-aligned.apk

          rm step15-release/MinikAkademi-0.1.0-release-aligned.apk

      - name: Verify signature, package, permissions and offline payload
        shell: bash
        run: |
          set -euo pipefail
          APK="step15-release/MinikAkademi-0.1.0-release-ci-signed.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"             | tee step15-release/apksigner-verification.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK"             | tee step15-release/aapt-badging.txt
          "$BUILD_TOOLS/aapt" dump permissions "$APK"             | tee step15-release/aapt-permissions.txt
          sha256sum "$APK" | tee step15-release/SHA256SUMS.txt

          grep -F "package: name='com.uysal.minikakademi'" step15-release/aapt-badging.txt
          grep -F "sdkVersion:'26'" step15-release/aapt-badging.txt
          grep -F "targetSdkVersion:'37'" step15-release/aapt-badging.txt

          if grep -Fq "android.permission.INTERNET" step15-release/aapt-permissions.txt; then
            echo "Release APK unexpectedly requests INTERNET permission."
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          import zipfile

          apk = Path("step15-release/MinikAkademi-0.1.0-release-ci-signed.apk")
          with zipfile.ZipFile(apk) as zf:
              names = zf.namelist()
          ogg = sum(name.endswith(".ogg") for name in names)
          json_files = sum(name.endswith(".json") for name in names)
          Path("step15-release/offline-payload-check.txt").write_text(
              f"Bundled OGG files: {ogg}\nBundled JSON files: {json_files}\n",
              encoding="utf-8",
          )
          assert ogg >= 150, ogg
          assert json_files >= 50, json_files
          print(f"Offline payload verified: {ogg} OGG, {json_files} JSON")
          PY

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: minik-akademi-step15-release-candidate
          path: step15-release/
          if-no-files-found: error
          retention-days: 90

      - name: Install emulator runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run comprehensive offline release acceptance test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu
            python tools/release/step15_release_acceptance.py               step15-release/MinikAkademi-0.1.0-release-ci-signed.apk

      - name: Verify comprehensive release evidence
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(find step15-smoke -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
          echo "Release acceptance screenshots: $COUNT"
          test "$COUNT" -eq 11

          for name in             01_release_welcome             02_release_setup_summary             03_release_dashboard             04_release_persistence_relaunch             05_release_tracing             06_release_literacy             07_release_mathematics             08_release_mini_games             09_release_parent_gate             10_release_parent_settings             11_release_reinstall_persistence
          do
            test -s "step15-smoke/$name.png"
          done

      - name: Verify minimum Android API 26 compatibility
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -eu
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb install -r step15-release/MinikAkademi-0.1.0-release-ci-signed.apk
            adb shell am start -W -n com.uysal.minikakademi/com.uysal.minikakademi.app.MainActivity
            sleep 2
            adb shell pidof com.uysal.minikakademi
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml step15-smoke/api26-window.xml
            grep -F "Minik Akademi" step15-smoke/api26-window.xml
            adb exec-out screencap -p > step15-smoke/12_release_api26_welcome.png

      - name: Verify API 26 smoke evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s step15-smoke/12_release_api26_welcome.png
          test -s step15-smoke/api26-window.xml

      - name: Upload comprehensive release evidence
        uses: actions/upload-artifact@v4
        with:
          name: minik-akademi-step15-release-acceptance-evidence
          path: step15-smoke/
          if-no-files-found: error
          retention-days: 90
