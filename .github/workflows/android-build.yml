name: Android Build

on:
  push:
    branches: [ "main" ]
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - "gradle/**"
      - "app/**"
      - "core/**"
      - "feature/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - "gradle/**"
      - "app/**"
      - "core/**"
      - "feature/**"
      - ".github/workflows/android-build.yml"

jobs:
  assemble-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 compile SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          PLATFORM_PACKAGE="$($SDKMANAGER --list --channel=3 | awk '/platforms;android-37([.;[:space:]]|$)/ {print $1; exit}')"
          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "Android API 37 platform package was not found in sdkmanager channels."
            $SDKMANAGER --list --channel=3 | grep -E 'platforms;android-37|build-tools;3[67]' || true
            exit 1
          fi

          echo "Installing $PLATFORM_PACKAGE"
          $SDKMANAGER --channel=3 "$PLATFORM_PACKAGE" "build-tools;36.0.0"

          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

          echo "Installed platforms:"
          ls -1 "$ANDROID_HOME/platforms"
          echo "Installed build-tools:"
          ls -1 "$ANDROID_HOME/build-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Gradle configuration check
        run: gradle --no-daemon help

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: minik-akademi-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
