name: Android Build

on:
  push:
    branches: [ "main" ]
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - "gradle/**"
      - "app/**"
      - "core/**"
      - "feature/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - "gradle/**"
      - "app/**"
      - "core/**"
      - "feature/**"
      - ".github/workflows/android-build.yml"

jobs:
  assemble-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Inspect Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Installed platforms:"
          ls -1 "$ANDROID_HOME/platforms" || true
          echo "Installed build-tools:"
          ls -1 "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Gradle configuration check
        run: gradle --no-daemon help

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
