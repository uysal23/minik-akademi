name: Audio Validation

on:
  push:
    paths:
      - "audio/**"
      - "content/**"
      - "tools/audio/validate_audio_assets.py"
      - ".github/workflows/audio-validation.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  validate-audio:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare approved V4 C audio\n        run: python tools/audio/prepare_v4_runtime_audio.py\n\n      - name: Validate offline speech and SFX coverage
        run: python tools/audio/validate_audio_assets.py
